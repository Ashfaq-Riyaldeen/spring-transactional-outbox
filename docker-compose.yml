# Infrastructure for running the services from Maven or an IDE: a database per service and a single-node Kafka.
# docker compose up -d starts it, docker compose down removes it together with its data.
# Image versions and host ports come from .env next to this file.
name: spring-transactional-outbox

services:
  orders-db:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "${ORDERS_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifications-db:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "${NOTIFICATIONS_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # containers of the stack connect to kafka:29092, the services on the host to localhost:${KAFKA_PORT}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # a topic exists only if kafka-init created it; a mistyped name fails instead of creating a stray topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  # Creates the topics with their partitions before the services connect, so a consumer never subscribes to a
  # topic that is still missing partitions, then exits
  kafka-init:
    image: apache/kafka:${KAFKA_VERSION}
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1 && break
          [ "$$attempt" = 30 ] && { echo "Kafka did not start"; exit 1; }
          sleep 2
        done
        for topic in order-events:3 order-events-dlt:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$${topic%%:*}" --partitions "$${topic##*:}" --replication-factor 1 || exit 1
        done

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    # a fractional quantity or a number sent as a string is rejected rather than truncated or converted
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # oncebox hands the producer an already serialized JSON payload
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # A send either completes or fails inside oncebox's emergency timeout, so an event marked failed is never
        # delivered afterwards; a batch blocked on missing metadata (batch-size x max.block.ms) plus that timeout
        # stays under the stuck threshold, so recovery never re-sends a batch that is still being sent.
        max.block.ms: 2000
        request.timeout.ms: 15000
        delivery.timeout.ms: 60000

app:
  kafka:
    order-events:
      name: ${ORDER_EVENTS_TOPIC:order-events}
      partitions: ${ORDER_EVENTS_PARTITIONS:3}
      replicas: ${ORDER_EVENTS_REPLICAS:1}

oncebox:
  # stuck recovery, cleanup and three DLQ jobs, plus one poller per event type
  thread-pool-size: 7
  outbox:
    sender:
      type: kafka
      bean-name: kafkaTemplate
      emergency-timeout: 90s
    defaults:
      polling:
        initial-delay: 5s
    events:
      order-created:
        topic: ${app.kafka.order-events.name}
        batch-size: 100
        polling:
          type: adaptive
          min-fixed-delay: 100ms
          max-fixed-delay: 5s
          multiplier: 2.0
        max-retries: 5
        backoff:
          delay: 2s
          multiplier: 2.0
      order-cancelled:
        topic: ${app.kafka.order-events.name}
        batch-size: 50
        polling:
          type: fixed
          fixed-delay: 1s
        max-retries: 3
        backoff:
          delay: 5s
          multiplier: 3.0
    stuck-recovery:
      max-batch-processing-time: 10m
      polling:
        initial-delay: 30s
    clean-up:
      ttl: 24h
      polling:
        initial-delay: 1m
    dlq:
      enabled: true
      polling:
        initial-delay: 1m
      clean-up:
        ttl: 7d

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

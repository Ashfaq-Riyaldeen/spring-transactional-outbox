# The services started on the host from Maven or an IDE, on their default ports, and the database exporters of
# this compose project.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # the exporters run next to the databases, in the same compose project
  - job_name: postgres
    static_configs:
      - targets: ["orders-db-exporter:9187"]
        labels:
          database: orders
      - targets: ["notifications-db-exporter:9187"]
        labels:
          database: notifications

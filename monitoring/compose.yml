# Monitoring of the services, included by docker-compose.yml and docker/compose.servlet.yml and started only with
# --profile observability. Each including file passes an env file that tells this one where the services run and
# which host ports to publish: monitoring/host.env for services started on the host, monitoring/servlet.env for
# the servlet stack.

services:
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # keeps the trace ids the services attach to their histogram buckets
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/${PROMETHEUS_TARGETS}.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    # services started on the host (monitoring/host.env) are scraped through host.docker.internal, which Linux does
    # not define by itself; unused in the servlet stack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.8.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # OTLP over HTTP, for services started on the host; the containers of a stack send to tempo:4318
    ports:
      - "${TEMPO_OTLP_PORT}:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  opensearch:
    profiles: ["observability"]
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      # local, single-user monitoring: no TLS and no login, never published beyond this machine
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20

  # The index template and the retention policy of the service-logs indices, applied before the first line is
  # shipped; then exits
  opensearch-init:
    profiles: ["observability"]
    image: curlimages/curl:8.12.1
    restart: "no"
    volumes:
      - ./opensearch:/opensearch:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS -X PUT http://opensearch:9200/_plugins/_ism/policies/service-logs \
          -H 'Content-Type: application/json' -d @/opensearch/ism-policy.json -o /dev/null \
          || curl -fsS http://opensearch:9200/_plugins/_ism/policies/service-logs -o /dev/null
        curl -fsS -X PUT http://opensearch:9200/_index_template/service-logs \
          -H 'Content-Type: application/json' -d @/opensearch/index-template.json -o /dev/null
        echo "service-logs template and policy applied"
    depends_on:
      opensearch:
        condition: service_healthy

  fluent-bit:
    profiles: ["observability"]
    image: fluent/fluent-bit:3.2.10
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ${SERVICE_LOGS}:/var/log/app:ro
      - fluent-bit-state:/fluent-bit/state
    restart: unless-stopped
    depends_on:
      opensearch-init:
        condition: service_completed_successfully

  # one exporter per database: orders-db and notifications-db are the same service names in both stacks
  orders-db-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: orders-db:5432/orders?sslmode=disable
      DATA_SOURCE_USER: orders
      DATA_SOURCE_PASS: orders

  notifications-db-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: notifications-db:5432/notifications?sslmode=disable
      DATA_SOURCE_USER: notifications
      DATA_SOURCE_PASS: notifications

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  opensearch-data:
  fluent-bit-state:

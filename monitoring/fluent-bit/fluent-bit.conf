# Tails the JSON log files of the services (the json-file profile) and ships every line to OpenSearch, one index
# per day. The offsets and the lines not yet delivered are kept in a volume, and a send is retried until OpenSearch
# takes it, so neither a restart nor an OpenSearch outage loses or repeats lines.
[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    storage.path  /fluent-bit/state/buffer

[INPUT]
    Name              tail
    Path              /var/log/app/*.json
    Tag               service.*
    Parser            json
    DB                /fluent-bit/state/tail.db
    Read_from_Head    On
    Refresh_Interval  5
    # a line with a long stack trace stays whole; only one past 1 MB is skipped
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1MB
    Skip_Long_Lines   On
    Mem_Buf_Limit     16MB
    storage.type      filesystem

[OUTPUT]
    Name                opensearch
    Match               service.*
    Host                opensearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     service-logs
    # the event time is the @timestamp the service wrote; this one is when the line was read
    Time_Key            ingested_at
    Suppress_Type_Name  On
    Trace_Error         On
    Retry_Limit         no_limits

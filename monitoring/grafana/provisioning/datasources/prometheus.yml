apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # dashboards refer to the datasource by this uid
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # matches the scrape interval, so a rate() over $__rate_interval always spans enough samples
      timeInterval: 15s
      # an exemplar on a latency bucket carries the trace id of a request that fell into it
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
